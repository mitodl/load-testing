---
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: "^24.0.0"
          cache: yarn
          cache-dependency-path: yarn.lock

      - name: Install
        run: yarn install --immutable

      - name: Lint and format
        run: yarn biome ci

      - name: Install k6
        uses: grafana/setup-k6-action@c47136d33d365efbeb9ae7266908b5dcf98cdece # v1.3.0

      # Compiles each entrypoint and resolves every import without sending a
      # single request. No load is generated against any environment.
      - name: Check scripts compile
        run: |
          for f in learn/learn.smoke.ts \
                   learn/learn.average-load.ts \
                   learn/learn.stress.ts \
                   learn/channels.compare.ts; do
            echo "::group::$f"
            k6 archive "$f" -O /dev/null
            echo "::endgroup::"
          done
