repos:
  - repo: https://github.com/biomejs/pre-commit
    # The tag ships the matching biome, so no additional_dependencies pin is
    # needed; keep it in step with the @biomejs/biome devDependency.
    rev: "v2.6.6"
    hooks:
      - id: biome-check
  - repo: https://github.com/scop/pre-commit-shfmt
    rev: v3.14.1-1
    hooks:
      - id: shfmt
  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.11.0.1-1
    hooks:
      - id: shellcheck
        args: ["--severity=warning"]
  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.5.0
    hooks:
      - id: detect-secrets
        args:
          - --baseline
          - .secrets.baseline
          - --exclude-files
          - "\\.yarn/"
          - --exclude-files
          - "yarn\\.lock"
          - --exclude-files
          - "learn/backend/client/"
        # The generated baseline declares filters.gibberish.should_exclude_secret,
        # which needs this plugin importable in the hook's environment.
        additional_dependencies: ["gibberish-detector"]
