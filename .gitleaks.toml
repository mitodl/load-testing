# gitleaks configuration, loaded by every hook in prek.toml.
#
# Only vendored and generated paths belong here, because this allowlist also
# applies to the hooks that read git. learn/data/ holds real credentials for a
# public repository, so a commit touching it is exactly the event to alarm on;
# the exclusion that keeps the working-tree scan quiet lives in
# .gitleaks-tree.toml, which only that hook loads.
#
# node_modules/ needs no entry: the default config already allowlists it, and
# useDefault inherits that.

[extend]
useDefault = true

[[allowlists]]
description = "Vendored and generated files, not hand-written source"
paths = [
  '''^\.yarn/''',
  '''^yarn\.lock$''',
  # Generated by scripts/generate-from-openapi.sh.
  '''^learn/backend/client/''',
]
