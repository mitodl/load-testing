# gitleaks configuration. Scoping lives here rather than in prek.toml because
# gitleaks takes no --exclude-path flag, and `gitleaks dir` does NOT read
# .gitignore: it walks the filesystem and skips only what this allowlist
# matches. node_modules/ is absent below because gitleaks' own default config
# already skips it.

[extend]
useDefault = true

[[allowlists]]
description = "Gitignored working-tree data that `gitleaks dir` would otherwise read"
paths = [
  # Real load-test credentials. This repository is public; see README.
  '''(^|/)learn/data/''',
  # k6 handleSummary() output.
  '''(^|/)results/''',
]

[[allowlists]]
description = "Vendored and generated files, not hand-written source"
paths = [
  '''(^|/)\.yarn/''',
  '''(^|/)yarn\.lock$''',
  # Generated by scripts/generate-from-openapi.sh.
  '''(^|/)learn/backend/client/''',
]
