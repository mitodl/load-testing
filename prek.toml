# prek.toml — pre-commit hook configuration
# Docs: https://prek.j178.dev
#
# Install hooks:      prek install
# Run on all files:   prek run --all-files
#:schema https://www.schemastore.org/prek.json

[[repos]]
# The tag ships the matching biome, so no additional_dependencies pin is needed;
# keep it in step with the @biomejs/biome devDependency.
repo = "https://github.com/biomejs/pre-commit"
rev = "v2.6.6"
hooks = [{ id = "biome-check" }]

[[repos]]
repo = "https://github.com/scop/pre-commit-shfmt"
rev = "v3.14.1-1"
hooks = [{ id = "shfmt" }]

[[repos]]
repo = "https://github.com/shellcheck-py/shellcheck-py"
rev = "v0.11.0.1-1"
hooks = [{ id = "shellcheck", args = ["--severity=warning"] }]

# ── Secrets: gitleaks ─────────────────────────────────────────────────────────
# `gitleaks` scans staged changes only, so it checks nothing once the work is
# committed (CI, `prek run --all-files`). `gitleaks-pr` is the CI counterpart:
# manual stage, so `prek run --all-files` and the commit hook skip it, and the
# autofix workflow runs it explicitly over the commits the pull request adds.
# `--pre-commit=false` and `--staged=false` cancel the flags in the hook's entry
# (the last occurrence wins); with either left on, gitleaks ignores --log-opts
# and scans nothing. It needs origin/main and full history, which the workflow
# fetches. Both modes read git, so node_modules/ and the gitignored credentials
# under learn/data/ are never scanned.

[[repos]]
repo = "https://github.com/gitleaks/gitleaks"
rev = "v8.30.1"

[[repos.hooks]]
id = "gitleaks"

[[repos.hooks]]
id = "gitleaks"
alias = "gitleaks-pr"
name = "Detect hardcoded secrets in the commits a PR adds"
stages = ["manual"]
args = ["--pre-commit=false", "--staged=false", "--log-opts=--no-merges origin/main..HEAD"]
